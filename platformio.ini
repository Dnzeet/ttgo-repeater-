[env:ttgo]
; arduino-esp32 2.0.17 (IDF 4.4): lwIP NAPT sudah ikut terkompilasi di sini
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
board_build.flash_mode = dio
board_build.f_flash = 40000000L
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
    ; --- layar ST7789 135x240 milik LilyGo T-Display ---
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DCGRAM_OFFSET=1
    -DTFT_MISO=-1
    -DTFT_MOSI=19
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=23
    -DLOAD_GLCD=1
    -DLOAD_GFXFF=1
    -DSPI_FREQUENCY=40000000
    ; kalau layar terbalik terhadap tombol atas/bawah:
    ; -DROT_A=3
    ; -DROT_B=1
